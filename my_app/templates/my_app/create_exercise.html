{% extends 'my_app/base.html' %}
{% block content %}
<h1>Create New Exercises</h1>
<form method="post">
    {% csrf_token %}
    <label>Exercise Name</label><br>
    <input type="text" name="exercise_name" placeholder="e.g. Bench Press" required><br>
    <label>Target Muscle Group</label><br>
    <input type="text" name="target_muscle_group" placeholder="e.g. Chest"><br>
    <button type="submit">Add Exercise</button>
</form>

<h2>All Exercises</h2>
<table id="exercise-table">
    <tr><th>Name</th><th>Target Muscle Group</th><th>Action</th></tr>
    {% for ex in exercises %}
    <tr data-exid="{{ ex.id }}">
        <td class="ex-name">{{ ex.exercise_name }}</td>
        <td class="ex-muscle">{{ ex.target_muscle_group }}</td>
        <td>
            <button type="button" onclick="editRow(this)">Edit</button>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No exercises found.</td></tr>
    {% endfor %}
</table>
<a href="{% url 'my_app:home' %}">Return to Home</a>

<script>
function editRow(btn) {
    var row = btn.closest('tr');
    var name = row.querySelector('.ex-name').innerText;
    var muscle = row.querySelector('.ex-muscle').innerText;
    var exid = row.getAttribute('data-exid');
    row.innerHTML = `
        <form method="post" onsubmit="return handleRemove(this)">
            {% csrf_token %}
            <td><input type="text" name="exercise_name" value="${name}" required></td>
            <td><input type="text" name="target_muscle_group" value="${muscle}"></td>
            <td>
                <input type="hidden" name="edit_id" value="${exid}">
                <input type="hidden" name="delete_exercise" value="">
                <button type="submit">Save</button>
                <button type="button" onclick="cancelEdit(this, '${name}', '${muscle}')">Cancel</button>
                <button type="button" style="color:red;" onclick="removeExercise(this)">Remove</button>
            </td>
        </form>
    `;
}
function cancelEdit(btn, name, muscle) {
    var row = btn.closest('tr');
    row.innerHTML = `
        <td class="ex-name">${name}</td>
        <td class="ex-muscle">${muscle}</td>
        <td><button type="button" onclick="editRow(this)">Edit</button></td>
    `;
}
function removeExercise(btn) {
    var form = btn.closest('form');
    form.querySelector('input[name=delete_exercise]').value = '1';
    form.submit();
}
function handleRemove(form) {
    // Allow normal submit
    return true;
}
</script>
{% endblock %}
