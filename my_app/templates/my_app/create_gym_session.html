<!DOCTYPE html>
<html>
<head>
    <title>Create Workout</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <img src="/static/logo.png" alt="Logo">
    </div>

    <div class="user-info">
        <span>{{ request.user.username }}</span>
        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">LOGOUT</button>
        </form>
    </div>
</header>

<main>
    <div class="card">

        <h1 style="font-size:14px; margin-bottom:30px;">CREATE WORKOUT</h1>

        <form method="POST">
            {% csrf_token %}

            <label>Workout Category:</label><br>
            <input type="text" name="category" placeholder="e.g. PUSH DAY, LEGS, CARDIO" required>

            <h3 style="font-size:12px; margin-top:30px;">EXERCISES</h3>

            <div id="exercise-container">

                <div class="exercise-row">
                    <select name="exercise">
                        <option value="">-- SELECT EXERCISE --</option>
                        {% for ex in exercises %}
                            <option value="{{ ex.id }}">{{ ex.name }} ({{ ex.muscle_group }})</option>
                        {% endfor %}
                    </select>

                    <input type="number" name="sets" placeholder="SETS" min="1">
                    <input type="number" name="reps" placeholder="REPS" min="1">
                    <input type="number" name="weight" placeholder="WEIGHT (KG)" step="0.1">

                    <button type="button" class="remove-row" style="width:150px;">REMOVE</button>
                </div>

            </div>

            <button type="button" id="add-row">ADD EXERCISE</button>

            <button type="submit">SAVE WORKOUT</button>
        </form>

    </div>
</main>

<footer>
    <p>RETRO FITNESS SYSTEM</p>
</footer>

<script>
// Add new exercise row
document.getElementById("add-row").addEventListener("click", function () {
    const container = document.getElementById("exercise-container");
    const firstRow = container.querySelector(".exercise-row");
    const newRow = firstRow.cloneNode(true);

    newRow.querySelectorAll("input").forEach(i => i.value = "");
    newRow.querySelector("select").selectedIndex = 0;

    container.appendChild(newRow);
});

// Remove row
document.addEventListener("click", function (e) {
    if (e.target.classList.contains("remove-row")) {
        const rows = document.querySelectorAll(".exercise-row");
        if (rows.length > 1) {
            e.target.parentElement.remove();
        }
    }
});

</script>
</body>
</html>
