<!DOCTYPE html>
<html>
<head>
    <title>Create Gym Session</title>
</head>
<body>

<h1>Create Gym Session</h1>

<!-- Create Gym Session Form -->
<form method="POST">
    {% csrf_token %}
    <label>Session Name</label><br>
    <input type="text" name="session_name" placeholder="e.g. Push Day"><br><br>
    <h2>Exercises</h2>
    <p>Select exercises and add sets below.</p>
    {% for muscle, ex_list in grouped_exercises %}
        <h3>{{ muscle }}</h3>
        {% for exercise in ex_list %}
            <div>
                <input type="checkbox" name="exercise_id" value="{{ exercise.id }}" id="ex{{ exercise.id }}">
                <label for="ex{{ exercise.id }}">{{ exercise.exercise_name }}</label>
                <div>
                    <label>Weight (kg):</label>
                    <input type="number" step="0.01" name="weight_{{ exercise.id }}">
                    <label>Reps:</label>
                    <input type="number" name="reps_{{ exercise.id }}">
                </div>
            </div>
        {% endfor %}
    {% endfor %}
    <button type="submit">Create Session</button>
</form>

<a href="{% url 'my_app:home' %}">Return to Home Page</a>

</body>
</html>
